name: "🐛 Bug Report"
description: "Report issues with the website or future platform."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Spotted something broken on the site or in the repo? Report it here — every fix helps the network.
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Where?"
      options:
        - "Website (az-imtn.netlify.app)"
        - "Repository / docs"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce (optional)"
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: "Browser / device (optional)"
    validations:
      required: false
  - type: checkboxes
    id: adab
    attributes:
      label: "Adab check"
      options:
        - label: "Reporting this kindly and honestly."
          required: true
